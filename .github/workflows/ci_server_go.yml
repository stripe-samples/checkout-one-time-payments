name: Server Tests (Go)
on:
  push:
    branches:
      - main
      - fix-ci
    paths:
      - 'server/go/**'
      - '!**.md'
  pull_request:
    paths:
      - 'server/go/**'
      - 'spec/**'
      - 'Gemfile'
      - 'ci/**'
      - '.github/workflows/ci_server_go.yml'
      - '.github/workflows/server_test.yml'
      - '!**.md'
  workflow_dispatch:

jobs:
  server_test:
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - server_type: go
            server_image: golang:latest
          - server_type: go
            server_image: golang:1.24
    uses: ./.github/workflows/server_test.yml
    secrets: inherit
    with:
      server_type: ${{ matrix.runtime.server_type }}
      server_image: ${{ matrix.runtime.server_image }}
