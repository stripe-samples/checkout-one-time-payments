name: Server Tests (Ruby)
on:
  push:
    branches:
      - main
      - fix-ci
    paths:
      - 'server/ruby/**'
      - '!**.md'
  pull_request:
    paths:
      - 'server/ruby/**'
      - 'spec/**'
      - 'Gemfile'
      - 'ci/**'
      - '.github/workflows/ci_server_ruby.yml'
      - '.github/workflows/server_test.yml'
      - '!**.md'
  workflow_dispatch:

jobs:
  server_test:
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - server_type: ruby
            server_image: ruby:latest
          - server_type: ruby
            server_image: ruby:3.0
    uses: ./.github/workflows/server_test.yml
    secrets: inherit
    with:
      server_type: ${{ matrix.runtime.server_type }}
      server_image: ${{ matrix.runtime.server_image }}
