name: Server Tests (dotnet)
on:
  push:
    branches:
      - main
      - fix-ci
    paths:
      - 'server/dotnet/**'
      - '!**.md'
  pull_request:
    paths:
      - 'server/dotnet/**'
      - 'spec/**'
      - 'Gemfile'
      - 'ci/**'
      - '.github/workflows/ci_server_dotnet.yml'
      - '.github/workflows/server_test.yml'
      - '!**.md'
  workflow_dispatch:

jobs:
  server_test:
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - server_type: dotnet
            server_image: mcr.microsoft.com/dotnet/sdk:10.0
    uses: ./.github/workflows/server_test.yml
    secrets: inherit
    with:
      server_type: ${{ matrix.runtime.server_type }}
      server_image: ${{ matrix.runtime.server_image }}
